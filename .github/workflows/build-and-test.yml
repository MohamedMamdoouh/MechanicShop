name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  # ──────────────────────────────────────────────
  # Job 1: build + unit tests (no Docker needed)
  # ──────────────────────────────────────────────
  unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: |
          dotnet test tests/MechanicShop.Domain.UnitTests/MechanicShop.Domain.UnitTests.csproj \
            --configuration Release --no-build --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=domain-unit-tests.trx" \
            --results-directory ./test-results

          dotnet test tests/MechanicShop.Application.UnitTests/MechanicShop.Application.UnitTests.csproj \
            --configuration Release --no-build --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=application-unit-tests.trx" \
            --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results/*.trx

  # ──────────────────────────────────────────────
  # Job 2: integration & subcutaneous tests (requires Docker for Testcontainers)
  # ──────────────────────────────────────────────
  integration-tests:
    name: Integration & Subcutaneous Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run integration tests
        run: |
          dotnet test tests/MechanicShop.Application.SubcutaneousTests/MechanicShop.Application.SubcutaneousTests.csproj \
            --configuration Release --no-build --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=subcutaneous-tests.trx" \
            --results-directory ./test-results

          dotnet test tests/MechanicShop.Api.IntegrationTests/MechanicShop.Api.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=api-integration-tests.trx" \
            --results-directory ./test-results
        env:
          # Testcontainers: use the pre-installed Docker daemon
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results/*.trx
